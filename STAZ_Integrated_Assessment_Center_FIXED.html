    const InputMarkahGuru = ({ currentUser, students, pbdRecords, setPbdRecords, gradingScales, examStatuses = {}, notify }) => {
      const assignments = currentUser.assignments || [];
      const [selectedIdx, setSelectedIdx] = useState(0);
      const activeAssignment = assignments[selectedIdx] || null;

      const isLocked = useMemo(() => {
        if (!activeAssignment) return false;
        const key = `${activeAssignment.academicYear}_${activeAssignment.examType}`;
        return (examStatuses[key] || 'ON') === 'OFF';
      }, [activeAssignment, examStatuses]);

      const assignedStudents = useMemo(() => {
        if (!activeAssignment) return [];
        return students.filter(s => s.academicYear === activeAssignment.academicYear && s.examType === activeAssignment.examType && s.year === activeAssignment.year && s.className === activeAssignment.className).sort((a,b)=>a.name.localeCompare(b.name));
      }, [students, activeAssignment]);

      const [markInputs, setMarkInputs] = useState({});

      useEffect(() => {
        if (!activeAssignment) return;
        const initial = {};
        assignedStudents.forEach(s => {
          const rec = pbdRecords.find(r => r.studentIc === s.ic && r.academicYear === activeAssignment.academicYear && r.examType === activeAssignment.examType && r.subject === activeAssignment.subject);
          initial[s.ic] = rec ? { mark: rec.mark !== undefined && rec.mark !== null ? rec.mark : '', tp: rec.tp || 1 } : { mark: '', tp: 1 };
        });
        setMarkInputs(initial);
      }, [activeAssignment, assignedStudents, pbdRecords]);

      const handleSave = () => {
        if (!activeAssignment) return;
        const key = `${activeAssignment.academicYear}_${activeAssignment.examType}`;
        if ((examStatuses[key] || 'ON') === 'OFF') { notify('Gagal: Kemasukan markah bagi pentaksiran ini telah DITUTUP oleh Admin!', 'error'); return; }

        let updated = [...pbdRecords];
        assignedStudents.forEach(s => {
          const input = markInputs[s.ic]; 
          if (!input) return;
          const idx = updated.findIndex(r => r.studentIc === s.ic && r.academicYear === activeAssignment.academicYear && r.examType === activeAssignment.examType && r.subject === activeAssignment.subject);
          const hasMark = input.mark !== '' && input.mark !== undefined && input.mark !== null;
          const hasTp = input.tp !== '' && input.tp !== undefined && input.tp !== null;

          if (hasMark || hasTp) {
            const newRec = { studentIc: s.ic, academicYear: activeAssignment.academicYear, examType: activeAssignment.examType, subject: activeAssignment.subject, mark: hasMark ? parseInt(input.mark) : '', tp: parseInt(input.tp) };
            idx >= 0 ? (updated[idx] = newRec) : updated.push(newRec);
          } else if (idx >= 0) { updated.splice(idx, 1); }
        });
        setPbdRecords(updated); notify('Markah & TP dikemas kini. Penyegerakan ke awan sedang diproses.', 'info');
      };

      if (assignments.length === 0) return <div className="bg-white p-8 rounded-2xl shadow-sm border border-slate-200 text-center text-sm font-medium text-slate-500">Anda belum diagihkan sebarang kelas / subjek oleh Pentadbir Sistem.</div>;

      return (
        <div className="space-y-6">
          <div className="bg-white p-6 rounded-2xl shadow-sm border flex flex-col md:flex-row justify-between gap-4 border-l-4 border-l-blue-900">
            <h2 className="text-2xl font-bold text-blue-950">Isi Markah PBD</h2>
            <select value={selectedIdx} onChange={e=>setSelectedIdx(parseInt(e.target.value))} className="border-2 border-slate-200 p-2.5 rounded-xl text-xs font-bold bg-slate-50 uppercase focus:border-blue-600 focus:bg-white transition-colors min-w-[300px]">
              {assignments.map((a, i) => <option key={i} value={i}>{getFullClassName(a.year, a.className)} - {a.subject} ({a.examType})</option>)}
            </select>
          </div>

          {activeAssignment && (
            <div className="bg-white p-6 rounded-2xl shadow-sm border border-slate-200">
              {isLocked && (
                <div className="bg-red-500 text-white p-4 rounded-xl mb-6 font-extrabold text-xs flex items-center justify-between shadow-md animate-fadeIn">
                  <div className="flex items-center gap-2"><Icon name="alert" size={20}/><span>PERHATIAN: Kemasukan dan pengemaskinian markah bagi pentaksiran ini telah DITUTUP oleh Pentadbir Sistem.</span></div>
                  <span className="bg-white text-red-600 px-3 py-1 rounded-lg text-[10px] uppercase font-black">LOCKED</span>
                </div>
              )}

              <div className="flex flex-col sm:flex-row justify-between items-center bg-gradient-to-r from-blue-900 to-[#1e40af] p-5 rounded-xl mb-6 text-xs font-semibold text-white uppercase shadow-md gap-4">
                <div className="space-y-1">
                  <div><span className="text-blue-300">SESI:</span> {activeAssignment.academicYear} <span className="mx-2 text-blue-500">|</span> <span className="text-blue-300">PENTAKSIRAN:</span> <span className="text-amber-400 font-bold">{activeAssignment.examType}</span></div>
                  <div className="text-sm"><span className="text-blue-300">KELAS:</span> {getFullClassName(activeAssignment.year, activeAssignment.className)} <span className="mx-2 text-blue-500">|</span> <span className="text-blue-300">SUBJEK:</span> {activeAssignment.subject}</div>
                </div>
                <button onClick={handleSave} disabled={isLocked} className={`px-6 py-3 rounded-xl flex gap-2 items-center font-black tracking-widest shadow transition-colors w-full sm:w-auto justify-center ${isLocked ? 'bg-slate-400 text-slate-200 cursor-not-allowed opacity-70' : 'bg-amber-400 hover:bg-amber-500 text-blue-950'}`}>
                  <Icon name="save" size={18}/> {isLocked ? 'KEMASUKAN DITUTUP' : 'SIMPAN MARKAH & TP'}
                </button>
              </div>

              <div className="overflow-x-auto border border-slate-200 rounded-xl">
                <table className="w-full text-left text-xs text-slate-700">
                  <thead className="bg-slate-100 border-b font-extrabold uppercase text-slate-600">
                    <tr><th className="p-4 w-12 text-center">#</th><th className="p-4">Nama Murid</th><th className="p-4 w-36">No IC</th><th className="p-4 w-32 text-center">Markah (%)</th><th className="p-4 w-24 text-center">Gred</th><th className="p-4 w-32 text-center">TP (1-6)</th></tr>
                  </thead>
                  <tbody className="divide-y divide-slate-100">
                    {assignedStudents.length > 0 ? assignedStudents.map((s, idx) => {
                      const input = markInputs[s.ic] || { mark: '', tp: 1 };
                      const gInfo = calculateDynamicGrade(input.mark, activeAssignment.examType, gradingScales);
                      return (
                        <tr key={s.ic} className="hover:bg-blue-50/50 transition-colors">
                          <td className="p-3 text-center font-medium">{idx+1}</td><td className="p-3 font-bold text-sm text-blue-950">{s.name}</td><td className="p-3 font-mono text-[11px]">{s.ic}</td>
                          <td className="p-3">
                            <input 
                              type="number" disabled={isLocked} value={input.mark} 
                              onChange={e => {
                                const val = e.target.value; const num = val === '' ? '' : parseInt(val);
                                setMarkInputs(p => {
                                  const currentTp = p[s.ic]?.tp || 1; let newTp = currentTp;
                                  if (num !== '') { const calc = calculateDynamicGrade(num, activeAssignment.examType, gradingScales); newTp = calc.tp; }
                                  return { ...p, [s.ic]: { mark: num, tp: newTp } };
                                });
                              }} 
                              className="w-full border-2 border-slate-200 p-2.5 rounded-lg text-center font-black text-blue-900 focus:border-blue-600 focus:bg-white bg-slate-50 transition-colors text-sm disabled:bg-slate-200 disabled:text-slate-500 disabled:cursor-not-allowed" 
                              placeholder="-"
                            />
                          </td>
                          <td className="p-3 text-center font-black text-lg text-slate-700">{input.mark !== '' ? gInfo.grade : '-'}</td>
                          <td className="p-3">
                            <select 
                              disabled={isLocked} value={input.tp} 
                              onChange={e => { const selectedTp = parseInt(e.target.value); setMarkInputs(p => ({ ...p, [s.ic]: { ...p[s.ic], tp: selectedTp } })); }} 
                              className="w-full border-2 border-slate-200 p-2.5 rounded-lg text-center font-bold text-blue-900 bg-slate-50 focus:border-blue-600 focus:bg-white text-sm disabled:bg-slate-200 disabled:text-slate-500 disabled:cursor-not-allowed"
                            >
                              {(["1","2","3","4","5","6"]).map(t => <option key={t} value={t}>TP {t}</option>)}
                            </select>
                          </td>
                        </tr>
                      );
                    }) : <tr><td colSpan="6" className="p-8 text-center text-slate-400 italic">Tiada murid direkodkan untuk kelas ini. Sila hubungi admin.</td></tr>}
                  </tbody>
                </table>
              </div>
            </div>
          )}
        </div>
      );
    };

    const PaparanKeseluruhanGuru = ({ students, pbdRecords, academicYears, examTypes, classes, subjectsByYear, subjectAbbreviations, gradingScales, notify, schoolLogo }) => {
      const [viewYear, setViewYear] = useState(academicYears[0]||'');
      const [viewExam, setViewExam] = useState(examTypes[0]?.name||'');
      const [viewStdYear, setViewStdYear] = useState(tahunList[0]);
      const [viewClassBase, setViewClassBase] = useState(classes[0]||'');

      const classStudents = useMemo(() => students.filter(s => s.academicYear === viewYear && s.examType === viewExam && s.year === viewStdYear && s.className === viewClassBase).sort((a,b)=>a.name.localeCompare(b.name)), [students, viewYear, viewExam, viewStdYear, viewClassBase]);
      const subjects = useMemo(() => subjectsByYear[viewStdYear] || [], [subjectsByYear, viewStdYear]);

      const handleGuruExcel = async () => {
        if(classStudents.length === 0) { notify('Tiada data murid untuk dicetak.', 'error'); return; }
        try {
          const workbook = new ExcelJS.Workbook();
          const sheetName = getFullClassName(viewStdYear, viewClassBase).substring(0,31).replace(/[\\/?*\[\]]/g, '');
          const sheet = workbook.addWorksheet(sheetName, { pageSetup: { paperSize: 9, orientation: 'landscape', fitToPage: true, fitToWidth: 1, printTitlesRow: '9:10' } });
          
          for(let r=1; r<=200; r++) sheet.getRow(r).fill = { type: 'pattern', pattern: 'solid', fgColor: { argb: 'FFFFFFFF' }};
          if (schoolLogo) { const logoId = workbook.addImage({ base64: schoolLogo, extension: 'png' }); sheet.addImage(logoId, { tl: { col: 0, row: 0 }, ext: { width: 100, height: 100 } }); }

          sheet.mergeCells('C1:J1'); sheet.getCell('C1').value = 'SEKOLAH KEBANGSAAN TUNKU AZIZAH'; sheet.getCell('C1').font = { name: 'Arial', size: 16, bold: true }; sheet.getCell('C1').alignment = { vertical: 'middle', horizontal: 'left' };
          sheet.mergeCells('C2:J2'); sheet.getCell('C2').value = 'REKOD PEREKODAN MARKAH DAN TAHAP PENGUASAAN'; sheet.getCell('C2').font = { name: 'Arial', size: 12, bold: true }; sheet.getCell('C2').alignment = { vertical: 'middle', horizontal: 'left' };

          sheet.getCell('C4').value = 'PENTAKSIRAN:'; sheet.getCell('D4').value = viewExam.toUpperCase(); sheet.getCell('D4').font = { bold: true };
          sheet.getCell('C5').value = 'TAHUN:'; sheet.getCell('D5').value = viewStdYear.toUpperCase(); sheet.getCell('D5').font = { bold: true };
          sheet.getCell('C6').value = 'KELAS:'; sheet.getCell('D6').value = getFullClassName(viewStdYear, viewClassBase); sheet.getCell('D6').font = { size: 14, bold: true, color: { argb: 'FF0000FF' } };

          sheet.getRow(8).height = 10;
          sheet.getRow(9).height = 30; sheet.getRow(10).height = 20;

          sheet.getCell('A9').value = 'BIL'; sheet.mergeCells('A9:A10');
          sheet.getCell('B9').value = 'NAMA MURID'; sheet.mergeCells('B9:B10');
          sheet.getCell('C9').value = 'NO. KAD PENGENALAN'; sheet.mergeCells('C9:C10');

          ['A','B','C'].forEach(col => {
            const c = sheet.getCell(`${col}9`); c.font = { bold: true, size: 10 }; c.alignment = { vertical: 'middle', horizontal: 'center' };
            c.fill = { type: 'pattern', pattern: 'solid', fgColor: { argb: 'FFD9E1F2' }}; c.border = { top: {style:'thin'}, left: {style:'thin'}, bottom: {style:'thin'}, right: {style:'thin'} };
          });
          sheet.getColumn('A').width = 5; sheet.getColumn('B').width = 45; sheet.getColumn('C').width = 18;

          let colIndex = 4; 
          subjects.forEach((sub) => {
            const startCol = sheet.getColumn(colIndex).letter; const endCol = sheet.getColumn(colIndex + 2).letter;
            sheet.mergeCells(`startCol9:{endCol}9`);
            const subCell = sheet.getCell(`${startCol}9`);
            subCell.value = (subjectAbbreviations[sub] || sub).toUpperCase(); subCell.font = { bold: true, size: 9 }; subCell.alignment = { vertical: 'middle', horizontal: 'center', wrapText: true };
            subCell.fill = { type: 'pattern', pattern: 'solid', fgColor: { argb: 'FFE2EFDA' }}; subCell.border = { top: {style:'thin'}, left: {style:'thin'}, bottom: {style:'thin'}, right: {style:'thin'} };

            ['M', 'G', 'TP'].forEach((lbl, idx) => {
              const subH = sheet.getCell(`${sheet.getColumn(colIndex + idx).letter}10`);
              subH.value = lbl; subH.font = { bold: true, size: 9 }; subH.alignment = { vertical: 'middle', horizontal: 'center' };
              subH.fill = { type: 'pattern', pattern: 'solid', fgColor: { argb: 'FFF2F2F2' }}; subH.border = { top: {style:'thin'}, left: {style:'thin'}, bottom: {style:'thin'}, right: {style:'thin'} };
              sheet.getColumn(colIndex + idx).width = 5; 
            });
            colIndex += 3;
          });

          let rowNum = 11;
          classStudents.forEach((std, stdIdx) => {
            const row = sheet.getRow(rowNum);
            row.getCell(1).value = stdIdx + 1; row.getCell(2).value = std.name; row.getCell(3).value = std.ic;
            for(let i=1; i<=3; i++) {
              const c = row.getCell(i); c.border = { top: {style:'thin'}, left: {style:'thin'}, bottom: {style:'thin'}, right: {style:'thin'} }; c.alignment = { vertical: 'middle', horizontal: i===2 ? 'left' : 'center' }; c.font = { size: 10 };
            }

            let currentDataCol = 4;
            subjects.forEach(sub => {

    const App = () => {
      const [isLoading, setIsLoading] = useState(true);
      const [isHydrated, setIsHydrated] = useState(false);
      const [loadError, setLoadError] = useState(false); // State perlindungan baru
      const [currentRole, setCurrentRole] = useState(null);
      const [currentUser, setCurrentUser] = useState(null);
      const [activeTab, setActiveTab] = useState('dashboard');
      const [toast, setToast] = useState(null);

      // System State
      const [schoolLogo, setSchoolLogo] = useState("");
      const [academicYears, setAcademicYears] = useState(initialAcademicYears);
      const [classes, setClasses] = useState(initialClasses);
      const [examTypes, setExamTypes] = useState(initialExamTypes);
      const [subjectsByYear, setSubjectsByYear] = useState(initialSubjectsByYear);
      const [subjectAbbreviations, setSubjectAbbreviations] = useState(initialSubjectAbbreviations);
      const [gradingScales, setGradingScales] = useState(initialGradingScales);
      const [examStatuses, setExamStatuses] = useState({});
      const [slipStatuses, setSlipStatuses] = useState({});
      const [students, setStudents] = useState(initialStudents);
      const [teachers, setTeachers] = useState(initialTeachers);
      const [pbdRecords, setPbdRecords] = useState(initialPbdRecords);
      // Simpan snapshot terakhir yang diketahui berjaya disegerakkan. Digunakan untuk
      // menghantar perubahan rekod sahaja, bukan menggantikan seluruh helaian PBD_RECORDS.
      const pbdBaselineRef = useRef(initialPbdRecords);
      const pbdSaveQueueRef = useRef(Promise.resolve());

      const pbdRecordKey = (r) => [r.studentIc, r.academicYear, r.examType, r.subject]
        .map(v => String(v == null ? '' : v).trim().toUpperCase()).join('||');

      useEffect(() => {
        let isMounted = true;
        const loadFromGAS = async () => {
          if (!GAS_WEB_APP_URL || GAS_WEB_APP_URL.includes("MASUKKAN_URL")) {
            setIsHydrated(true);
            setIsLoading(false);
            return;
          }
          try {
            const res = await fetch(GAS_WEB_APP_URL + '?action=loadAll');
            const json = await res.json();
            if (isMounted && json.status === 'success' && json.data) {
              const d = json.data;
              if (d.schoolLogo !== undefined) setSchoolLogo(d.schoolLogo || "");
              if (d.academicYears && d.academicYears.length > 0) setAcademicYears(d.academicYears);
              if (d.classes && d.classes.length > 0) setClasses(d.classes);
              if (d.examTypes && d.examTypes.length > 0) setExamTypes(d.examTypes);
              if (d.subjectsByYear && Object.keys(d.subjectsByYear).length > 0) setSubjectsByYear(d.subjectsByYear);
              if (d.subjectAbbreviations && Object.keys(d.subjectAbbreviations).length > 0) setSubjectAbbreviations(d.subjectAbbreviations);
              if (d.gradingScales && Object.keys(d.gradingScales).length > 0) setGradingScales(d.gradingScales);
              if (d.examStatuses) setExamStatuses(d.examStatuses);
              if (d.slipStatuses) setSlipStatuses(d.slipStatuses);
              if (d.students) setStudents(d.students);
              if (d.teachers) setTeachers(d.teachers);
              if (d.pbdRecords) {
                pbdBaselineRef.current = d.pbdRecords.map(r => ({ ...r }));
                setPbdRecords(d.pbdRecords);
              }
              
              setIsHydrated(true); // Pindah ke sini: HANYA BENARKAN JIKA BERJAYA
              setIsLoading(false);
            } else {
              throw new Error("Gagal memperoleh status kejayaan (success) daripada pelayan.");
            }
          } catch(err) {
            console.error("Gagal muat data dari Google Sheets:", err);
            if (isMounted) {
              setLoadError(true); // Mencegah autosave berjalan
              setIsLoading(false);
            }
          }
        };
        loadFromGAS();
        return () => { isMounted = false; };
      }, []);

      const saveToGAS = async (key, val) => {
        if (!isHydrated || loadError) return false;
        if (!GAS_WEB_APP_URL || GAS_WEB_APP_URL.includes("MASUKKAN_URL")) return false;
        try {
          const response = await fetch(GAS_WEB_APP_URL, {
            method: 'POST',
            headers: { 'Content-Type': 'text/plain;charset=utf-8' },
            body: JSON.stringify({ action: key === 'pbdChanges' ? 'savePbdChanges' : 'saveKey', key: key, value: val })
          });
          if (!response.ok) throw new Error('HTTP ' + response.status);
          const result = await response.json();
          if (!result || result.status !== 'success') throw new Error((result && result.message) || 'Pelayan tidak mengesahkan simpanan.');
          return true;
        } catch(e) {
          console.error("Gagal simpan ke Google Sheets:", e);
          return false;
        }
      };

      // Penggunaan Hook Tersuai bagi menghalang simpanan automatik menimpa data awan apabila sistem baru dimulakan
      useAutosave('schoolLogo', schoolLogo, isHydrated, saveToGAS);
      useAutosave('academicYears', academicYears, isHydrated, saveToGAS);
      useAutosave('classes', classes, isHydrated, saveToGAS);
      useAutosave('examTypes', examTypes, isHydrated, saveToGAS);
      useAutosave('subjectsByYear', subjectsByYear, isHydrated, saveToGAS);
      useAutosave('subjectAbbreviations', subjectAbbreviations, isHydrated, saveToGAS);
      useAutosave('gradingScales', gradingScales, isHydrated, saveToGAS);
      useAutosave('examStatuses', examStatuses, isHydrated, saveToGAS);
      useAutosave('slipStatuses', slipStatuses, isHydrated, saveToGAS);
      useAutosave('students', students, isHydrated, saveToGAS);
      useAutosave('teachers', teachers, isHydrated, saveToGAS);

      // Simpan perubahan rekod PBD sahaja. Rekod guru lain yang tidak wujud dalam
      // snapshot lama tidak akan dipadam oleh browser yang belum menerima data terbaru.
      useEffect(() => {
        if (!isHydrated || loadError) return;
        const snapshot = (pbdRecords || []).map(r => ({ ...r }));
        pbdSaveQueueRef.current = pbdSaveQueueRef.current.then(async () => {
          const baseline = pbdBaselineRef.current || [];
          const oldMap = new Map(baseline.map(r => [pbdRecordKey(r), r]));
          const newMap = new Map(snapshot.map(r => [pbdRecordKey(r), r]));
          const upserts = [];
          const deletes = [];
          newMap.forEach((record, key) => {
            const oldRecord = oldMap.get(key);
            if (!oldRecord || JSON.stringify(oldRecord) !== JSON.stringify(record)) upserts.push(record);
          });
          oldMap.forEach((record, key) => {
            if (!newMap.has(key)) deletes.push({ studentIc: record.studentIc, academicYear: record.academicYear, examType: record.examType, subject: record.subject });
          });
          if (!upserts.length && !deletes.length) return;
          const ok = await saveToGAS('pbdChanges', { upserts, deletes });
          if (!ok) {
            notify('AMARAN: Perubahan PBD belum disahkan tersimpan di Google Sheets. Cuba semula selepas sambungan pulih.', 'error');
            return;
          }
          // Kemas kini baseline berdasarkan perubahan yang dihantar sahaja.
          const nextMap = new Map((pbdBaselineRef.current || []).map(r => [pbdRecordKey(r), { ...r }]));
          deletes.forEach(d => nextMap.delete(pbdRecordKey(d)));
          upserts.forEach(r => nextMap.set(pbdRecordKey(r), { ...r }));
          pbdBaselineRef.current = Array.from(nextMap.values());
        }).catch(err => console.error('Barisan simpanan PBD gagal:', err));
      }, [pbdRecords, isHydrated, loadError]);

      const notify = (msg, type = 'info') => { setToast({ msg, type }); setTimeout(() => setToast(null), 3000); };

      if (isLoading) return <div className="min-h-screen flex flex-col items-center justify-center bg-slate-100 text-blue-900"><div className="w-12 h-12 border-4 border-blue-900 border-t-amber-400 rounded-full animate-spin mb-4"></div><p className="font-bold text-sm tracking-widest uppercase">Memuatkan Pangkalan Data...</p></div>;
      
      // Paparan jika ralat memuatkan data dari pangkalan. Mengelakkan pengguna melakukan kerosakan tambahan.
      if (loadError) return (
        <div className="min-h-screen flex flex-col items-center justify-center bg-slate-100 text-slate-800 p-6 text-center">
          <div className="bg-white p-10 rounded-3xl shadow-xl max-w-lg border border-red-200">
            <div className="w-20 h-20 bg-red-100 text-red-600 rounded-full flex items-center justify-center mx-auto mb-6"><Icon name="alert" size={40}/></div>
            <h2 className="text-2xl font-black mb-4 uppercase text-red-700">Ralat Pemuatan Data</h2>
            <p className="font-medium text-sm text-slate-600 mb-6 leading-relaxed">
              Sistem gagal menghubungi pangkalan data (Google Sheets) atau mengalami ralat pemindahan. Demi melindungi data sedia ada daripada terpadam, akses sistem telah <strong>dikunci sepenuhnya</strong>.
            </p>
            <button onClick={() => window.location.reload()} className="bg-red-600 text-white font-bold py-3 px-8 rounded-xl shadow-md hover:bg-red-700 transition-colors uppercase tracking-wider text-xs">
              Muat Semula Halaman (Refresh)
            </button>
          </div>
        </div>
      );

      if (!currentRole) return (
        <>
          <Login teachers={teachers} students={students} setCurrentRole={setCurrentRole} setCurrentUser={setCurrentUser} notify={notify} schoolLogo={schoolLogo} />
          {toast && <div className={`fixed bottom-5 right-5 px-6 py-3.5 rounded-2xl shadow-2xl text-xs font-bold text-white z-50 flex items-center gap-2 animate-fadeIn ${toast.type === 'error' ? 'bg-red-600' : 'bg-emerald-600'}`}><Icon name={toast.type === 'success' ? 'check' : 'alert'} size={18} /><span>{toast.msg}</span></div>}
        </>
      );

      return (
        <div className="min-h-screen flex flex-col bg-slate-100 print:bg-white">
          <header className="bg-gradient-to-r from-blue-900 to-[#1e40af] text-white shadow-lg sticky top-0 z-40 no-print">
            <div className="max-w-7xl mx-auto px-4 h-16 flex items-center justify-between">
              <div className="flex items-center space-x-3">
                {schoolLogo ? <img src={schoolLogo} className="w-11 h-11 object-contain drop-shadow" /> : <div className="w-10 h-10 bg-amber-400 rounded-full text-blue-950 font-black flex items-center justify-center shadow">STAZ</div>}
                <div><h1 className="text-base font-black text-amber-400 tracking-wider">SK TUNKU AZIZAH</h1><p className="text-[10px] text-blue-100 font-medium tracking-widest">SISTEM PEREKODAN PENTAKSIRAN AWAN</p></div>
              </div>
              <div className="flex items-center space-x-4">
                <div className="text-right hidden sm:block"><p className="text-xs font-extrabold uppercase">{currentUser.name}</p><p className="text-[10px] text-amber-300 uppercase tracking-widest">{currentRole}</p></div>
                <button onClick={()=>{setCurrentRole(null);setCurrentUser(null);setActiveTab('dashboard');}} className="bg-red-500 hover:bg-red-600 px-4 py-2 rounded-lg text-xs font-bold flex items-center gap-1.5 shadow transition-colors"><Icon name="logout" size={14}/>Keluar</button>
              </div>
            </div>
          </header>

          {currentRole !== 'ibubapa' && (
            <div className="bg-white border-b border-slate-200 shadow-sm no-print overflow-x-auto">
              <div className="max-w-7xl mx-auto px-4 flex space-x-1 py-2.5 min-w-max">
                {currentRole === 'admin' ? (
                  <>
                    <button onClick={()=>setActiveTab('dashboard')} className={`px-4 py-2 rounded-lg text-xs font-bold transition-colors ${activeTab==='dashboard'?'bg-blue-900 text-amber-400 shadow':'text-slate-600 hover:bg-slate-100'}`}>Dashboard Eksekutif</button>
                    <button onClick={()=>setActiveTab('student_mgmt')} className={`px-4 py-2 rounded-lg text-xs font-bold transition-colors ${activeTab==='student_mgmt'?'bg-blue-900 text-amber-400 shadow':'text-slate-600 hover:bg-slate-100'}`}>Pengurusan Murid</button>
                    <button onClick={()=>setActiveTab('teacher_mgmt')} className={`px-4 py-2 rounded-lg text-xs font-bold transition-colors ${activeTab==='teacher_mgmt'?'bg-blue-900 text-amber-400 shadow':'text-slate-600 hover:bg-slate-100'}`}>Guru & Agihan</button>
                    <button onClick={()=>setActiveTab('admin_pbd')} className={`px-4 py-2 rounded-lg text-xs font-bold transition-colors ${activeTab==='admin_pbd'?'bg-blue-900 text-amber-400 shadow':'text-slate-600 hover:bg-slate-100'}`}>Import PBD Lepas</button>
                    <span className="w-px h-6 bg-slate-300 mx-2 self-center"></span>
                    <button onClick={()=>setActiveTab('exam_settings')} className={`px-4 py-2 rounded-lg text-xs font-bold transition-colors ${activeTab==='exam_settings'?'bg-slate-800 text-white shadow':'text-slate-500 hover:bg-slate-100'}`}>Sesi & Pentaksiran</button>
                    <button onClick={()=>setActiveTab('grade_settings')} className={`px-4 py-2 rounded-lg text-xs font-bold transition-colors ${activeTab==='grade_settings'?'bg-slate-800 text-white shadow':'text-slate-500 hover:bg-slate-100'}`}>Tetapan Gred</button>
                    <button onClick={()=>setActiveTab('subject_settings')} className={`px-4 py-2 rounded-lg text-xs font-bold transition-colors ${activeTab==='subject_settings'?'bg-slate-800 text-white shadow':'text-slate-500 hover:bg-slate-100'}`}>Subjek</button>
                    <button onClick={()=>setActiveTab('class_settings')} className={`px-4 py-2 rounded-lg text-xs font-bold transition-colors ${activeTab==='class_settings'?'bg-slate-800 text-white shadow':'text-slate-500 hover:bg-slate-100'}`}>Kelas</button>
                  </>
                ) : (
                  <>
                    <button onClick={()=>setActiveTab('input_marks')} className={`px-5 py-2.5 rounded-lg text-xs font-bold transition-colors ${activeTab==='input_marks'?'bg-blue-900 text-amber-400 shadow':'text-slate-600 hover:bg-slate-100'}`}>Borang Isi Markah PBD</button>
                    <button onClick={()=>setActiveTab('overall_view')} className={`px-5 py-2.5 rounded-lg text-xs font-bold transition-colors ${activeTab==='overall_view'?'bg-blue-900 text-amber-400 shadow':'text-slate-600 hover:bg-slate-100'}`}>Semakan Keputusan Penuh</button>
                  </>
                )}
              </div>
            </div>
          )}

          <main className="flex-1 max-w-7xl w-full mx-auto p-4 lg:p-8 print:p-0 print:m-0 print:max-w-none">
            {currentRole === 'admin' && activeTab === 'dashboard' && <AdminDashboard students={students} teachers={teachers} pbdRecords={pbdRecords} academicYears={academicYears} examTypes={examTypes} classes={classes} schoolLogo={schoolLogo} setSchoolLogo={setSchoolLogo} subjectsByYear={subjectsByYear} subjectAbbreviations={subjectAbbreviations} gradingScales={gradingScales} notify={notify} />}
            {currentRole === 'admin' && activeTab === 'admin_pbd' && <AdminUploadPBD pbdRecords={pbdRecords} setPbdRecords={setPbdRecords} academicYears={academicYears} examTypes={examTypes} notify={notify} />}
            {currentRole === 'admin' && activeTab === 'student_mgmt' && <PengurusanMurid students={students} setStudents={setStudents} pbdRecords={pbdRecords} setPbdRecords={setPbdRecords} classes={classes} academicYears={academicYears} examTypes={examTypes} notify={notify} />}
            {currentRole === 'admin' && activeTab === 'teacher_mgmt' && <PengurusanGuru teachers={teachers} setTeachers={setTeachers} academicYears={academicYears} examTypes={examTypes} classes={classes} subjectsByYear={subjectsByYear} notify={notify} />}
            {currentRole === 'admin' && activeTab === 'exam_settings' && <TetapanPeperiksaan academicYears={academicYears} setAcademicYears={setAcademicYears} examTypes={examTypes} setExamTypes={setExamTypes} classes={classes} examStatuses={examStatuses} setExamStatuses={setExamStatuses} slipStatuses={slipStatuses} setSlipStatuses={setSlipStatuses} notify={notify} />}
            {currentRole === 'admin' && activeTab === 'grade_settings' && <TetapanGred examTypes={examTypes} gradingScales={gradingScales} setGradingScales={setGradingScales} notify={notify} />}
            {currentRole === 'admin' && activeTab === 'subject_settings' && <TetapanSubjek subjectsByYear={subjectsByYear} setSubjectsByYear={setSubjectsByYear} subjectAbbreviations={subjectAbbreviations} setSubjectAbbreviations={setSubjectAbbreviations} pbdRecords={pbdRecords} setPbdRecords={setPbdRecords} teachers={teachers} setTeachers={setTeachers} notify={notify} />}
            {currentRole === 'admin' && activeTab === 'class_settings' && <TetapanKelas classes={classes} setClasses={setClasses} notify={notify} />}
            
            {currentRole === 'guru' && activeTab === 'input_marks' && <InputMarkahGuru currentUser={currentUser} students={students} pbdRecords={pbdRecords} setPbdRecords={setPbdRecords} gradingScales={gradingScales} examStatuses={examStatuses} notify={notify} />}
            {currentRole === 'guru' && activeTab === 'overall_view' && <PaparanKeseluruhanGuru students={students} pbdRecords={pbdRecords} academicYears={academicYears} examTypes={examTypes} classes={classes} subjectsByYear={subjectsByYear} subjectAbbreviations={subjectAbbreviations} gradingScales={gradingScales} notify={notify} schoolLogo={schoolLogo} />}
            
            {currentRole === 'ibubapa' && <ParentPortal student={currentUser} academicYears={academicYears} examTypes={examTypes} pbdRecords={pbdRecords} subjectsByYear={subjectsByYear} gradingScales={gradingScales} schoolLogo={schoolLogo} notify={notify} slipStatuses={slipStatuses} />}
          </main>

          {toast && <div className={`fixed bottom-5 right-5 px-6 py-3.5 rounded-2xl shadow-2xl text-xs font-bold text-white z-50 flex items-center gap-2 animate-fadeIn ${toast.type === 'error' ? 'bg-red-600' : 'bg-emerald-600'}`}><Icon name={toast.type === 'success' ? 'check' : 'alert'} size={18} /><span>{toast.msg}</span></div>}
        </div>
      );
    };

    const root = ReactDOM.createRoot(document.getElementById('root'));
    root.render(<App />);
  </script>
</body>
</html>
